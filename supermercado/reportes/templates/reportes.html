<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif; background-color:#0f172a; color:rgb(18,11,79); margin:0; height:100vh; display:flex;">

  <!-- Barra lateral -->
  <div style="width:220px; height:100vh; background:#020617; padding:20px; box-sizing:border-box;">
    <h2 style="color:#38bdf8; margin-bottom:20px;">Reportes</h2>
    <div style="margin:10px 0; padding:8px; color:#D3DCED; border-radius:6px; cursor:pointer;">Dashboard</div>
    <div style="margin:10px 0; padding:8px; color:#D3DCED; border-radius:6px; cursor:pointer;">Financieros</div>
    <div style="margin:10px 0; padding:8px; color:#D3DCED; border-radius:6px; cursor:pointer;">Operativos</div>
    <div style="margin:10px 0; padding:8px; color:#D3DCED; border-radius:6px; cursor:pointer;">RRHH</div>
    <div style="margin:10px 0; padding:8px; color:#D3DCED; border-radius:6px; cursor:pointer;">Configuración</div>
  </div>

  <div style="flex:1; padding:20px;">
    <h1 style="color:#38bdf8; margin-bottom:20px;">Módulo de Reportes - {tipo}</h1>
    
    <div style="background:#D3DCED; padding:20px; border-radius:2px; text-align:left;">
      <div style="color:#492557; font-weight:bold; font-size:20px; margin-bottom:10px;">Reporte</div>
      
      <div style="display:flex; justify-content:space-between; margin:6px 0; font-size:14px;">
        <span style="color:#94a3b8;">Tipo:</span>
        <span>{tipo}</span>
      </div>
      
      <div style="display:flex; justify-content:space-between; margin:6px 0; font-size:14px;">
        <span style="color:#94a3b8;">Monto:</span>
        <span style="color:#38bdf8; font-weight:bold;">$1.000.000</span>
      </div>
      
      <div style="display:flex; justify-content:space-between; margin:6px 0; font-size:14px;">
        <span style="color:#94a3b8;">Fecha:</span>
        <span>2026-01-01</span>
      </div>
      
      <div style="display:flex; justify-content:space-between; margin:6px 0; font-size:14px;">
        <span style="color:#94a3b8;">Usuario:</span>
        <span>camilalopez</span>
      </div>
      
      <div style="margin-top:10px; font-size:13px; color:#161417;">
        Este es mi reporte hehe
      </div>
    </div>
  </div>

</body>
</html>
