{% extends "layout.html" %}
{% block menu_terceros %}menu-activo{% endblock %}
{% block contenido %}
<div class="contenedorP">
    <a href="{% url 'terceros:lista_terceros' %}" style="color:#94a3b8; text-decoration:none; font-size:13px;">← Volver</a>
    <h1>{{ accion }} {{ tipo }}</h1>
    <form method="post" style="max-width:500px;">
        {% csrf_token %}
        <div style="display:flex; flex-direction:column; gap:16px;">
            {% for campo in form %}
            <div>
                <label style="display:block; color:#94a3b8; font-size:13px; margin-bottom:6px;">{{ campo.label }}</label>
                {{ campo }}
                {% if campo.errors %}<span style="color:#fca5a5; font-size:12px;">{{ campo.errors.0 }}</span>{% endif %}
            </div>
            {% endfor %}
            <div style="display:flex; gap:12px;">
                <button type="submit" style="background:#38bdf8; color:#0f172a; border:none; padding:12px 28px; border-radius:6px; font-weight:bold; cursor:pointer;">{{ accion }} {{ tipo }}</button>
                <a href="{% url 'terceros:lista_terceros' %}"><button type="button" style="background:transparent; color:#94a3b8; border:1px solid #334155; padding:12px 20px; border-radius:6px; cursor:pointer;">Cancelar</button></a>
            </div>
        </div>
    </form>
</div>
<style>.form-input{width:100%;padding:10px 14px;background:#1e293b;border:1px solid #334155;border-radius:6px;color:#D3DCED;font-size:14px;box-sizing:border-box;}</style>
{% endblock %}
